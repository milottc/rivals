<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rivals - Babylon.js</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#cfe0f5; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; user-select:none; }
  #c { width:100%; height:100%; display:block; outline:none; }
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }

  /* top bar: yellow team / timer / purple team */
  #topbar { position:fixed; top:8px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; }
  .team { height:48px; min-width:150px; display:flex; align-items:center; justify-content:flex-end; gap:12px; padding:0 18px; font-size:30px; font-weight:900; border-radius:4px; box-shadow:0 3px 8px rgba(0,0,0,.3); }
  .team .ic { font-size:22px; opacity:.9; }
  #tY { background:linear-gradient(#f6d23a,#d9a800); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.35); }
  #tP { background:linear-gradient(#7c5cf0,#4a2fc4); justify-content:flex-start; flex-direction:row-reverse; }
  #timer { height:48px; min-width:100px; display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(#3a3d4a,#23252f); font-size:26px; font-weight:800; border-radius:4px; box-shadow:0 3px 8px rgba(0,0,0,.3); }

  /* crosshair "( )" like the reference */
  #crosshair { position:fixed; left:50%; top:50%; width:44px; height:34px; margin:-17px 0 0 -22px; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; top:0; width:10px; height:30px; border:3px solid rgba(255,255,255,.95); border-radius:50%; box-shadow:0 0 2px rgba(0,0,0,.6); }
  #crosshair::before { left:0; border-right-color:transparent; border-top-color:transparent; border-bottom-color:transparent; }
  #crosshair::after { right:0; border-left-color:transparent; border-top-color:transparent; border-bottom-color:transparent; }
  #crosshair i { position:absolute; left:20px; top:14px; width:4px; height:4px; background:#fff; border-radius:50%; box-shadow:0 0 2px #000; }

  #hit { position:fixed; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; opacity:0; transition:opacity .08s; }
  #hit::before, #hit::after { content:''; position:absolute; left:18px; top:-4px; width:4px; height:48px; background:#fff; transform:rotate(45deg); box-shadow:0 0 4px #000; }
  #hit::after { transform:rotate(-45deg); }
  #hit.head::before, #hit.head::after { background:#ff3b3b; }
  #hit.kill::before, #hit.kill::after { background:#ffd23f; }

  #killfeed { position:fixed; top:14px; right:14px; font-size:14px; font-weight:800; text-align:right; }
  #killfeed div { background:linear-gradient(90deg,#7c5cf0,#c9a400); padding:5px 14px; margin-bottom:4px; border-radius:4px; text-shadow:0 1px 3px #000; }
  #elim { position:fixed; top:72%; width:100%; text-align:center; font-size:22px; font-weight:800; text-shadow:0 2px 4px #000; opacity:0; transition:opacity .2s; }
  #elim b { color:#a98bff; }

  /* bottom-left: health */
  #spec { position:fixed; left:0; bottom:44px; background:rgba(20,22,30,.85); padding:4px 14px 4px 10px; font-weight:800; font-size:15px; border-radius:0 6px 6px 0; }
  #pbar { position:fixed; left:10px; bottom:10px; width:290px; height:26px; background:rgba(15,20,15,.85); border:2px solid #000; border-radius:14px; overflow:hidden; }
  #pbar > div { height:100%; background:linear-gradient(#7de05a,#3da12a); transition:width .12s; }
  #hpnum { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; text-shadow:0 1px 3px #000; }

  /* bottom-right: ammo + weapon + slots */
  #ammo { position:fixed; right:26px; bottom:92px; font-weight:900; text-shadow:0 3px 8px #000; display:flex; align-items:baseline; gap:6px; }
  #ammo .big { font-size:56px; line-height:1; }
  #ammo .small { font-size:18px; opacity:.8; }
  #wname { position:fixed; right:26px; bottom:66px; font-size:22px; font-weight:800; text-shadow:0 2px 4px #000; }
  #weapons { position:fixed; right:20px; bottom:10px; display:flex; gap:6px; }
  #weapons .slot { width:56px; height:48px; border-radius:6px; background:rgba(30,32,42,.85); border:2px solid transparent; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; opacity:.8; }
  #weapons .slot.sel { border-color:#f6d23a; opacity:1; }
  #hint { position:fixed; left:50%; bottom:8px; transform:translateX(-50%); background:rgba(20,22,30,.85); padding:6px 14px; border-radius:8px; font-size:11px; font-weight:700; opacity:.9; white-space:nowrap; }
  #hint b { background:#444a5c; padding:1px 5px; border-radius:3px; margin:0 4px 0 10px; }

  #banner { position:fixed; top:24%; width:100%; display:flex; justify-content:center; opacity:0; transition:opacity .2s; }
  .bn { min-width:240px; text-align:center; padding:6px 28px 10px; border:3px solid #fff; border-radius:6px; font-weight:900; font-size:44px; line-height:1; background:linear-gradient(#3a3d52,#1d2030); box-shadow:0 6px 16px rgba(0,0,0,.4); }
  .bn small { display:block; font-size:14px; letter-spacing:3px; opacity:.9; margin-bottom:3px; }
  .bn.g { background:linear-gradient(#3fcf5a,#12802c); } .bn.r { background:linear-gradient(#ff5a5a,#a01818); }
  #hurt { position:fixed; inset:0; box-shadow:inset 0 0 160px 40px rgba(255,0,0,.7); opacity:0; transition:opacity .25s; }
  #scope { position:fixed; inset:0; display:none; background:radial-gradient(circle at center, transparent 0, transparent 27vmin, #000 27.4vmin); }
  #scope::before { content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:#000; }
  #scope::after { content:''; position:absolute; top:0; bottom:0; left:50%; width:1px; background:#000; }

  #overlay { position:fixed; inset:0; background:linear-gradient(90deg, rgba(20,10,60,.55), rgba(20,10,60,0) 65%); display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding-left:7vw; cursor:pointer; }
  #overlay h1 { font-size:clamp(64px,11vw,150px); margin:0; line-height:.9; font-style:italic; font-weight:900; letter-spacing:2px; color:#ffd23f; -webkit-text-stroke:4px #3b1fa8; text-shadow:6px 6px 0 #6a3df0, 10px 10px 0 rgba(0,0,0,.35); transform:rotate(-4deg); }
  #overlay .sub { font-size:22px; font-weight:800; letter-spacing:8px; margin:14px 0 30px 6px; text-shadow:0 2px 6px #000; }
  #overlay button { font:900 40px 'Segoe UI',system-ui,sans-serif; letter-spacing:4px; padding:14px 70px; border:4px solid #000; border-radius:10px; background:linear-gradient(#5dff7a,#1fbf45); color:#fff; text-shadow:0 3px 0 #0b7a27; box-shadow:0 8px 0 #0b7a27; cursor:pointer; transition:transform .1s; }
  #overlay button:hover { transform:translateY(-3px) scale(1.04); }
  #overlay p { line-height:1.7; margin:22px 0 0 6px; font-size:15px; text-shadow:0 2px 4px #000; max-width:460px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="topbar">
    <div class="team" id="tY"><span class="ic">&#9760;</span><span id="sY">0</span></div>
    <div id="timer"><span>&#8987;</span><span id="tt">1:30</span></div>
    <div class="team" id="tP"><span class="ic">&#9760;</span><span id="sP">0</span></div>
  </div>
  <div id="killfeed"></div>
  <div id="elim"></div>
  <div id="spec">&#128065; 1</div>
  <div id="pbar"><div style="width:100%"></div><div id="hpnum" style="position:absolute;background:none;height:auto">100</div></div>
  <div id="ammo"><span class="big">30</span><span class="small">90</span></div>
  <div id="wname">Assault Rifle</div>
  <div id="weapons"></div>
  <div id="hint"><b>Tab</b>Scoreboard <b>F</b>Quick Melee <b>Q</b>Quick Utility</div>
  <div id="crosshair"><i></i></div>
  <div id="hit"></div>
  <div id="scope"></div>
  <div id="banner"></div>
  <div id="hurt"></div>
</div>

<div id="overlay">
  <h1>RIVALS</h1>
  <div class="sub">1V1 ARENA DUELS</div>
  <button id="play">PLAY</button>
  <p>First to 5 rounds wins.<br>WASD move · Shift sprint · Space jump · Mouse aim · Click shoot · Right-click aim down sights · 1/2/3 or wheel switch weapon · R reload · Esc pause</p>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(() => {
  const V3 = BABYLON.Vector3, C3 = BABYLON.Color3, C4 = BABYLON.Color4;
  const $ = id => document.getElementById(id);

  // ---------- CONFIG (tweak here) ----------
  const CFG = {
    roundsToWin: 5,
    S: 60,
    player: { hp: 100, speed: 8, sprint: 12, jump: 8.5, gravity: 26, eye: 1.7 },
    bot:    { hp: 100, speed: 5.2, fireDelay: 0.55, accuracy: 0.33, damage: 10 }
  };
  const WEAPONS = [
    { name:'Assault Rifle', tag:'AR', dmg:14, head:2,   delay:0.095, mag:30, reserve:90, reload:1.4, auto:true,  pellets:1, hip:0.02, ads:0.006,  recoil:0.006, zoom:0.95 },
    { name:'Shotgun',       tag:'SG', dmg:11, head:1.5, delay:0.75,  mag:6,  reserve:24, reload:1.8, auto:false, pellets:9, hip:0.06, ads:0.04,   recoil:0.04,  zoom:1.05 },
    { name:'Sniper',        tag:'SN', dmg:80, head:2,   delay:1.1,   mag:4,  reserve:12, reload:2.0, auto:false, pellets:1, hip:0.05, ads:0.0015, recoil:0.05,  zoom:0.3  }
  ];

  // ---------- Engine / scene ----------
  const canvas = $('c');
  const engine = new BABYLON.Engine(canvas, true);
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new C4(0.86, 0.9, 0.97, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogColor = new C3(0.86, 0.89, 0.96);
  scene.fogDensity = 0.0035;

  // flat, hazy lighting like the reference
  const hemi = new BABYLON.HemisphericLight('h', new V3(0, 1, 0), scene);
  hemi.intensity = 0.78; hemi.diffuse = new C3(1, 1, 1); hemi.groundColor = new C3(0.62, 0.64, 0.8);
  const sun = new BABYLON.DirectionalLight('s', new V3(-0.45, -1, -0.35), scene);
  sun.position = new V3(30, 60, 25); sun.intensity = 0.3;
  const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
  shadowGen.usePercentageCloserFiltering = true;
  shadowGen.filteringQuality = BABYLON.ShadowGenerator.QUALITY_MEDIUM;
  shadowGen.bias = 0.0006; shadowGen.normalBias = 0.02; shadowGen.darkness = 0.55;

  // ---------- Sky + cloud sea (island floats in the sky) ----------
  const skyTex = new BABYLON.DynamicTexture('sky', { width: 1024, height: 512 }, scene);
  { const c = skyTex.getContext(); const g = c.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0, '#1666e0'); g.addColorStop(.25, '#3f93f5'); g.addColorStop(.42, '#9ccaff'); g.addColorStop(.5, '#e4eeff'); g.addColorStop(1, '#ffffff');
    c.fillStyle = g; c.fillRect(0, 0, 1024, 512);
    const cols = ['255,255,255', '246,222,240', '226,214,250'];
    for (let i = 0; i < 90; i++) {
      const x = Math.random() * 1024, y = 150 + Math.random() * 150, r = 40 + Math.random() * 110;
      const rg = c.createRadialGradient(x, y, 0, x, y, r), col = cols[i % 3];
      rg.addColorStop(0, `rgba(${col},.7)`); rg.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    skyTex.update(); }
  const sky = BABYLON.MeshBuilder.CreateSphere('sky', { diameter: 900, segments: 16 }, scene);
  const skyM = new BABYLON.StandardMaterial('skyM', scene);
  skyM.backFaceCulling = false; skyM.disableLighting = true; skyM.emissiveTexture = skyTex;
  skyM.diffuseColor = C3.Black(); skyM.specularColor = C3.Black(); skyM.fogEnabled = false;
  sky.material = skyM; sky.infiniteDistance = true; sky.isPickable = false;

  const seaTex = new BABYLON.DynamicTexture('sea', { width: 1024, height: 1024 }, scene);
  { const c = seaTex.getContext(); c.fillStyle = '#eef0fa'; c.fillRect(0, 0, 1024, 1024);
    const cols = ['255,255,255', '240,222,245', '210,225,255', '255,236,240'];
    for (let i = 0; i < 220; i++) {
      const x = Math.random() * 1024, y = Math.random() * 1024, r = 40 + Math.random() * 120;
      const rg = c.createRadialGradient(x, y, 0, x, y, r), col = cols[i % 4];
      rg.addColorStop(0, `rgba(${col},.55)`); rg.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    seaTex.update(); }
  const sea = BABYLON.MeshBuilder.CreateGround('sea', { width: 1200, height: 1200 }, scene);
  sea.position.y = -30; sea.isPickable = false;
  const seaM = new BABYLON.StandardMaterial('seaM', scene);
  seaM.disableLighting = true; seaM.emissiveTexture = seaTex; seaM.emissiveTexture.uScale = 3; seaM.emissiveTexture.vScale = 3;
  seaM.diffuseColor = C3.Black(); seaM.specularColor = C3.Black(); seaM.fogEnabled = false;
  sea.material = seaM;

  // ---------- Materials ----------
  // panel texture: pale blocks with thin seams and small "+" joints, like the reference
  function panelTexture(base, line, cross, cells = 4) {
    const size = 512, t = new BABYLON.DynamicTexture('pt', size, scene), c = t.getContext(), cell = size / cells;
    c.fillStyle = base; c.fillRect(0, 0, size, size);
    for (let i = 0; i < cells; i++) for (let j = 0; j < cells; j++) {
      c.fillStyle = `rgba(80,90,140,${0.018 * ((i * 5 + j * 3) % 4)})`; c.fillRect(i * cell, j * cell, cell, cell);
    }
    c.strokeStyle = line; c.lineWidth = 3;
    for (let i = 0; i <= cells; i++) {
      const p = i * cell;
      c.beginPath(); c.moveTo(p, 0); c.lineTo(p, size); c.stroke();
      c.beginPath(); c.moveTo(0, p); c.lineTo(size, p); c.stroke();
    }
    c.fillStyle = cross;
    for (let i = 0; i <= cells; i++) for (let j = 0; j <= cells; j++) {
      const x = i * cell, y = j * cell; c.fillRect(x - 1.5, y - 9, 3, 18); c.fillRect(x - 9, y - 1.5, 18, 3);
    }
    t.update(); t.anisotropicFilteringLevel = 8; return t;
  }
  const texMat = (base, line, cross) => {
    const m = new BABYLON.StandardMaterial('tm', scene);
    m.diffuseTexture = panelTexture(base, line, cross); m.specularColor = new C3(.05, .05, .06);
    m.emissiveColor = new C3(.06, .06, .08); return m;
  };
  const plain = (r, g, b, spec = .08, power = 32) => {
    const m = new BABYLON.StandardMaterial('m', scene);
    m.diffuseColor = new C3(r, g, b); m.specularColor = new C3(spec, spec, spec); m.specularPower = power; return m;
  };
  const gloss = (r, g, b) => plain(r, g, b, .7, 80);
  const mats = {
    w: texMat('#d9dbe8', '#b4b8ce', '#9ca2bd'),
    g: texMat('#c7cadc', '#a5aac4', '#8d93b0'),
    l: texMat('#e6e8f2', '#c4c8da', '#aab0c8'),
    o: plain(.9, .5, .3)
  };
  // blue tarp curtain with wavy folds
  const tarpTex = new BABYLON.DynamicTexture('tarp', 256, scene);
  { const c = tarpTex.getContext();
    for (let y = 0; y < 256; y++) { const s = .5 + .5 * Math.sin(y * .28); c.fillStyle = `rgb(${20 + 30 * s | 0},${90 + 55 * s | 0},${215 + 25 * s | 0})`; c.fillRect(0, y, 256, 1); }
    tarpTex.update(); }
  mats.blue = new BABYLON.StandardMaterial('tarp', scene);
  mats.blue.diffuseTexture = tarpTex; mats.blue.emissiveColor = new C3(.05, .12, .3); mats.blue.specularColor = new C3(.1, .1, .15);

  // world-space UVs so panel seams stay a constant size on every block
  function worldUV(m, tile = 8) {
    const P = m.getVerticesData(BABYLON.VertexBuffer.PositionKind), N = m.getVerticesData(BABYLON.VertexBuffer.NormalKind), uv = [];
    const ox = m.position.x, oy = m.position.y, oz = m.position.z;
    for (let i = 0; i < P.length; i += 3) {
      const x = P[i] + ox, y = P[i + 1] + oy, z = P[i + 2] + oz;
      const ax = Math.abs(N[i]), ay = Math.abs(N[i + 1]), az = Math.abs(N[i + 2]);
      let u, v;
      if (ay >= ax && ay >= az) { u = x; v = z; } else if (ax >= az) { u = z; v = y; } else { u = x; v = y; }
      uv.push(u / tile, v / tile);
    }
    m.updateVerticesData(BABYLON.VertexBuffer.UVKind, uv);
  }
  const solid = (m, cast = true) => {
    m.checkCollisions = true; m.isPickable = true; m.metadata = { solid: true }; m.receiveShadows = true;
    if (cast) shadowGen.addShadowCaster(m);
    return m;
  };
  function block(x, z, w, h, d, mk = 'w', y0 = 0) {
    const b = BABYLON.MeshBuilder.CreateBox('b', { width: w, height: h, depth: d, updatable: true }, scene);
    b.position.set(x, y0 + h / 2, z); worldUV(b); b.material = mats[mk]; solid(b); return b;
  }
  function tarp(x, z, w, h, d) {
    const b = BABYLON.MeshBuilder.CreateBox('tarp', { width: w, height: h, depth: d }, scene);
    b.position.set(x, h / 2 + .4, z); b.material = mats.blue; solid(b, false); return b;
  }
  // Ramp: low end at local -z, high end at local +z.
  function wedge(x, z, w, h, d, rotY, mk = 'w') {
    const m = BABYLON.MeshBuilder.CreateBox('ramp', { width: w, height: h, depth: d, updatable: true }, scene);
    const pos = m.getVerticesData(BABYLON.VertexBuffer.PositionKind).slice();
    for (let i = 0; i < pos.length; i += 3) if (pos[i + 2] < 0 && pos[i + 1] > 0) pos[i + 1] = -h / 2 + 0.08;
    m.updateVerticesData(BABYLON.VertexBuffer.PositionKind, pos);
    const nor = []; BABYLON.VertexData.ComputeNormals(pos, m.getIndices(), nor);
    m.updateVerticesData(BABYLON.VertexBuffer.NormalKind, nor);
    m.position.set(x, h / 2, z); m.rotation.y = rotY; worldUV(m); m.material = mats[mk];
    m.refreshBoundingInfo(); solid(m); return m;
  }
  // decorative metal truss tower (like the one in the reference)
  function truss(x, z, h) {
    const parts = [], B = (w, hh, d, px, py, pz) => { const b = BABYLON.MeshBuilder.CreateBox('t', { width: w, height: hh, depth: d }, scene); b.position.set(px, py, pz); parts.push(b); };
    for (const dx of [-.4, .4]) for (const dz of [-.4, .4]) B(.1, h, .1, x + dx, h / 2, z + dz);
    for (let y = .5; y < h; y += 1) { B(.9, .06, .06, x, y, z + .4); B(.9, .06, .06, x, y, z - .4); B(.06, .06, .9, x + .4, y, z); B(.06, .06, .9, x - .4, y, z); }
    const m = BABYLON.Mesh.MergeMeshes(parts, true, true);
    m.material = plain(.7, .72, .8, .3, 40); m.isPickable = false; return m;
  }

  // ---------- Arena (floating island) ----------
  const S = CFG.S;
  const ground = BABYLON.MeshBuilder.CreateGround('g', { width: S, height: S }, scene);
  const gm = new BABYLON.StandardMaterial('gm', scene);
  gm.diffuseTexture = panelTexture('#e2e4ef', '#bfc3d7', '#a7adc5');
  gm.diffuseTexture.uScale = S / 8; gm.diffuseTexture.vScale = S / 8;
  gm.specularColor = C3.Black(); gm.emissiveColor = new C3(.06, .06, .08);
  ground.material = gm; ground.receiveShadows = true; ground.checkCollisions = true; ground.metadata = { solid: true };

  // low lip around the island edge
  [[0, S / 2 - .5, S, 1], [0, -S / 2 + .5, S, 1], [S / 2 - .5, 0, 1, S], [-S / 2 + .5, 0, 1, S]].forEach(([x, z, w, d]) => block(x, z, w, 1.6, d, 'g'));

  // centre block with four ramps
  block(0, 0, 14, 3.4, 14, 'w');
  wedge(0, -12, 6, 3.4, 10, 0); wedge(0, 12, 6, 3.4, 10, Math.PI);
  wedge(-12, 0, 6, 3.4, 10, Math.PI / 2); wedge(12, 0, 6, 3.4, 10, -Math.PI / 2);

  // corner towers with blue tarp walls + ramps
  [[-20, -20], [20, -20], [-20, 20], [20, 20]].forEach(([x, z], i) => {
    block(x, z, 9, 6, 9, i % 2 ? 'l' : 'w');
    block(x, z, 9.6, .6, 9.6, 'g', 6);
    tarp(x + 4.65, z, .2, 4.5, 7); tarp(x - 4.65, z, .2, 4.5, 7);
    wedge(x, z + (z > 0 ? -6 : 6), 4, 2.6, 7, z > 0 ? 0 : Math.PI);
  });

  // tall paneled walls (corridors) with blue curtains + trusses
  block(-25, -8, 1.2, 9, 14, 'w'); block(25, 8, 1.2, 9, 14, 'w');
  tarp(-24.3, -8, .15, 5, 10); tarp(24.3, 8, .15, 5, 10);
  truss(-23.2, -4, 11); truss(23.2, 4, 11);

  // cover
  block(0, -20, 10, 1.2, 1.2, 'g'); block(0, 20, 10, 1.2, 1.2, 'g');
  block(-9, -9, 6, 1.4, 2, 'g'); block(9, 9, 6, 1.4, 2, 'g');
  block(-14, -14, 2.2, 1.2, 1.2, 'o'); block(14, 14, 2.2, 1.2, 1.2, 'o');
  [[-5, -14, 2.5], [5, 14, 2.5], [-14, 8, 2], [14, -8, 2], [-18, -2, 1.8], [18, 2, 1.8]].forEach(([x, z, s]) => block(x, z, s, s, s, 'l'));

  // ---------- Player camera ----------
  const cam = new BABYLON.FreeCamera('cam', new V3(0, CFG.player.eye, -24), scene);
  cam.inputs.clear(); cam.inertia = 0; cam.minZ = 0.05; cam.fov = 1.2;
  cam.checkCollisions = true; cam.applyGravity = false;
  cam.ellipsoid = new V3(0.45, 0.85, 0.45);

  // ---------- Viewmodels: chunky glossy skins ----------
  const vm = new BABYLON.TransformNode('vm', scene); vm.parent = cam; vm.position.set(.34, -.32, .75);
  const GP = (par, w, h, d, x, y, z, m) => {
    const b = BABYLON.MeshBuilder.CreateBox('g', { width: w, height: h, depth: d }, scene);
    b.parent = par; b.position.set(x, y, z); b.material = m; b.isPickable = false; return b;
  };
  const VM = [];
  { // 0: gift-wrap assault rifle (green / red / blue)
    const g = new BABYLON.TransformNode('gun0', scene); g.parent = vm;
    const green = gloss(.1, .65, .25), red = gloss(.95, .1, .12), blue = gloss(.2, .7, .95), blk = gloss(.08, .08, .1);
    GP(g, .14, .18, .6, 0, 0, 0, green); GP(g, .13, .15, .5, 0, -.01, .52, blue); GP(g, .05, .05, .3, 0, .01, .9, blk);
    GP(g, .1, .25, .14, 0, -.2, .05, blk); GP(g, .11, .15, .3, 0, -.02, -.4, green);
    GP(g, .15, .19, .06, 0, 0, -.12, red); GP(g, .15, .19, .06, 0, 0, .16, red); GP(g, .12, .1, .12, 0, .15, .3, red);
    VM.push(g);
  }
  { // 1: shotgun (orange / black)
    const g = new BABYLON.TransformNode('gun1', scene); g.parent = vm;
    const org = gloss(1, .5, .1), blk = gloss(.08, .08, .1), wht = gloss(.95, .95, 1);
    GP(g, .15, .18, .6, 0, 0, 0, org); GP(g, .07, .07, .65, -.04, .04, .58, blk); GP(g, .07, .07, .65, .04, .04, .58, blk);
    GP(g, .17, .1, .28, 0, -.12, .3, blk); GP(g, .12, .16, .35, 0, -.03, -.4, org); GP(g, .16, .04, .2, 0, .1, .1, wht);
    VM.push(g);
  }
  { // 2: neon sniper (black / pink / purple)
    const g = new BABYLON.TransformNode('gun2', scene); g.parent = vm;
    const blk = gloss(.07, .07, .1), pink = gloss(1, .3, .65), pur = gloss(.55, .25, 1);
    GP(g, .13, .17, .95, 0, 0, 0, blk); GP(g, .05, .05, .85, 0, .02, .9, blk);
    GP(g, .135, .175, .08, 0, 0, -.2, pink); GP(g, .135, .175, .08, 0, 0, .12, pur); GP(g, .135, .175, .06, 0, 0, .3, pink);
    GP(g, .11, .2, .35, 0, -.05, -.55, pur);
    const sc = BABYLON.MeshBuilder.CreateCylinder('sc', { diameter: .14, height: .45 }, scene);
    sc.parent = g; sc.rotation.x = Math.PI / 2; sc.position.set(0, .15, .1); sc.material = pur; sc.isPickable = false;
    VM.push(g);
  }
  const flashM = new BABYLON.StandardMaterial('fm', scene);
  flashM.emissiveColor = new C3(1, .85, .35); flashM.disableLighting = true;
  VM.forEach((g, i) => {
    const fl = BABYLON.MeshBuilder.CreateSphere('fl', { diameter: .25 }, scene);
    fl.parent = g; fl.position.z = i === 1 ? 1 : 1.15; fl.material = flashM; fl.isPickable = false; fl.setEnabled(false); g.flash = fl;
  });

  // ---------- Roblox-style avatars ----------
  function blocky(parent, baseY, t, isBot, shirt, pants) {
    const rm = (r, g, b) => plain(r, g, b, .25, 40);
    const skin = rm(.96, .8, .2), shirtM = rm(...shirt), pantsM = rm(...pants), dark = rm(.08, .08, .1), face = rm(.04, .04, .04);
    const P = (w, h, d, x, y, z, m, head) => {
      const b = BABYLON.MeshBuilder.CreateBox('bp', { width: w * t, height: h * t, depth: d * t }, scene);
      b.parent = parent; b.position.set(x * t, y * t + baseY, z * t); b.material = m; b.isPickable = isBot;
      if (isBot) b.metadata = { bot: true, head: !!head };
      shadowGen.addShadowCaster(b); return b;
    };
    P(1, 2, 1, -.5, 1, 0, pantsM); P(1, 2, 1, .5, 1, 0, pantsM);          // legs
    P(2, 2, 1, 0, 3, 0, shirtM);                                          // torso
    P(1.2, 1.2, 1.2, 0, 4.6, 0, skin, true);                              // head
    P(.2, .2, .05, -.28, 4.7, .62, face, true); P(.2, .2, .05, .28, 4.7, .62, face, true); P(.5, .16, .05, 0, 4.35, .62, face, true);
    P(.9, .9, 1.9, -1, 3.3, .9, skin); P(.9, .9, 1.9, 1, 3.3, .9, skin);  // arms forward
    P(.35, .45, 2.2, 0, 3.6, 1.7, dark);                                  // gun
  }

  const hero = new BABYLON.TransformNode('hero', scene);
  hero.position.set(0, 0, -24); blocky(hero, 0, .45, false, [.95, .55, .15], [.2, .3, .7]);

  const bot = BABYLON.MeshBuilder.CreateBox('botc', { width: .9, height: 2, depth: .9 }, scene);
  bot.isVisible = false; bot.isPickable = false; bot.checkCollisions = true;
  bot.ellipsoid = new V3(.5, 1, .5);
  blocky(bot, -1, .38, true, [.5, .3, .95], [.2, .2, .3]);
  bot.setEnabled(false);

  // ---------- State ----------
  const st = {
    playing: false, roundActive: false, hp: 100, bhp: 100, w: 0, ammo: WEAPONS.map(w => w.mag), res: WEAPONS.map(w => w.reserve),
    reloading: false, rid: 0, cd: 0, vy: 0, grounded: true, ps: 0, bs: 0, botCd: 1, strafeDir: 1, strafeT: 0,
    botStuck: 0, ads: false, adsK: 0, kick: 0, rec: 0, bob: 0, moving: false, timeLeft: 90, timerId: null
  };
  const keys = {};
  let yaw = 0, pitch = 0, started = false, saved = null, mt = 0, hitT = 0;

  // ---------- Audio ----------
  let ac = null;
  function sfx(f1, f2, dur, type = 'square', vol = 0.08) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(t + dur);
    } catch (e) {}
  }

  // ---------- HUD ----------
  $('weapons').innerHTML = WEAPONS.map((w, i) => `<div class="slot" id="w${i}">${i + 1} ${w.tag}</div>`).join('');
  const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  function hud() {
    $('pbar').firstChild.style.width = Math.max(0, st.hp) + '%';
    $('hpnum').textContent = Math.max(0, Math.ceil(st.hp));
    $('sY').textContent = st.ps; $('sP').textContent = st.bs;
    $('tt').textContent = fmtTime(Math.max(0, st.timeLeft));
    const W = WEAPONS[st.w];
    $('wname').textContent = W.name;
    $('ammo').innerHTML = st.reloading ? '<span class="big">...</span>' : `<span class="big">${st.ammo[st.w]}</span><span class="small">${st.res[st.w]}</span>`;
    WEAPONS.forEach((w, i) => $('w' + i).classList.toggle('sel', i === st.w));
  }
  const setHud = on => { $('hud').style.display = on ? 'block' : 'none'; };
  function banner(big, ms = 1600, small = '', cls = '') {
    const b = $('banner');
    b.innerHTML = `<div class="bn ${cls}">${small ? `<small>${small}</small>` : ''}${big}</div>`;
    b.style.opacity = 1; setTimeout(() => b.style.opacity = 0, ms);
  }
  const hurtFlash = () => { const h = $('hurt'); h.style.opacity = 1; setTimeout(() => h.style.opacity = 0, 120); };
  function hitMarker(head, kill) {
    const h = $('hit'); h.className = kill ? 'kill' : head ? 'head' : ''; h.style.opacity = 1;
    clearTimeout(hitT); hitT = setTimeout(() => h.style.opacity = 0, 130);
  }
  function feed(txt) {
    const d = document.createElement('div'); d.textContent = txt; $('killfeed').prepend(d);
    setTimeout(() => d.remove(), 4000);
  }
  function elim(html) {
    const e = $('elim'); e.innerHTML = html; e.style.opacity = 1; setTimeout(() => e.style.opacity = 0, 2000);
  }

  function startTimer() {
    clearInterval(st.timerId); st.timeLeft = 90;
    st.timerId = setInterval(() => {
      if (!st.roundActive) return;
      st.timeLeft--; hud();
      if (st.timeLeft <= 0) { st.timeLeft = 0; endRound(false, 'TIME UP'); }
    }, 1000);
  }

  // ---------- Weapons ----------
  function setWeapon(i) {
    if (i === st.w) return;
    st.w = i; st.reloading = false; st.rid++; st.cd = 0.25;
    VM.forEach((g, k) => g.setEnabled(k === i)); hud();
  }
  VM.forEach((g, k) => g.setEnabled(k === 0));

  const sparkM = new BABYLON.StandardMaterial('sm', scene);
  sparkM.emissiveColor = new C3(1, 1, 1); sparkM.disableLighting = true;
  function spark(p) {
    const s = BABYLON.MeshBuilder.CreateBox('sp', { size: .15 }, scene);
    s.position.copyFrom(p); s.material = sparkM; s.isPickable = false; setTimeout(() => s.dispose(), 120);
  }
  function tracer(from, to, color) {
    const l = BABYLON.MeshBuilder.CreateLines('t', { points: [from, to] }, scene);
    l.color = color; l.isPickable = false; setTimeout(() => l.dispose(), 60);
  }
  const shootPick = m => m.isPickable && m.isEnabled() && (m.metadata?.solid || m.metadata?.bot);

  function shoot() {
    if (!st.roundActive || st.reloading || st.cd > 0) return;
    const W = WEAPONS[st.w];
    if (st.ammo[st.w] <= 0) return reload();
    st.ammo[st.w]--; st.cd = W.delay; st.kick = 1;
    st.rec += W.recoil; pitch -= W.recoil; yaw += (Math.random() - .5) * W.recoil * .6;
    const gunN = VM[st.w]; gunN.flash.setEnabled(true); setTimeout(() => gunN.flash.setEnabled(false), 45);
    if (st.w === 0) sfx(260, 60, .08, 'sawtooth', .06); else if (st.w === 1) sfx(140, 40, .25, 'sawtooth', .12); else sfx(90, 30, .4, 'square', .12);

    const fwd = cam.getDirection(V3.Forward()), right = cam.getDirection(V3.Right()), up = cam.getDirection(V3.Up());
    const spread = (st.ads ? W.ads : W.hip) + (st.moving ? 0.01 : 0);
    const muzzle = vm.getAbsolutePosition().add(fwd.scale(0.9));
    let total = 0, head = false;
    for (let p = 0; p < W.pellets; p++) {
      const dir = fwd.add(right.scale((Math.random() - .5) * 2 * spread)).add(up.scale((Math.random() - .5) * 2 * spread)).normalize();
      const hit = scene.pickWithRay(new BABYLON.Ray(cam.position, dir, 150), shootPick);
      const end = hit?.hit ? hit.pickedPoint : cam.position.add(dir.scale(150));
      tracer(muzzle, end, new C3(1, .9, .4));
      if (hit?.hit) {
        if (hit.pickedMesh.metadata?.bot) {
          const isHead = !!hit.pickedMesh.metadata.head; if (isHead) head = true;
          total += W.dmg * (isHead ? W.head : 1);
        } else spark(hit.pickedPoint);
      }
    }
    if (total > 0) {
      st.bhp -= total;
      if (st.bhp <= 0) { st.bhp = 0; hud(); hitMarker(head, true); sfx(600, 1200, .2, 'triangle', .08); feed('YOU  \u27A4  BOT'); elim('Eliminated <b>BOT</b>'); endRound(true); return; }
      hitMarker(head, false); sfx(900, 500, .06, 'sine', .06);
    }
    hud();
    if (st.ammo[st.w] === 0) reload();
  }
  function reload() {
    const W = WEAPONS[st.w];
    if (st.reloading || st.ammo[st.w] === W.mag || st.res[st.w] <= 0 || !st.roundActive) return;
    st.reloading = true; hud();
    const id = ++st.rid, wi = st.w;
    setTimeout(() => {
      if (id !== st.rid) return;
      const need = Math.min(W.mag - st.ammo[wi], st.res[wi]);
      st.ammo[wi] += need; st.res[wi] -= need; st.reloading = false; hud();
    }, W.reload * 1000);
  }

  // ---------- Round flow ----------
  function startRound() {
    st.hp = CFG.player.hp; st.bhp = CFG.bot.hp; st.vy = 0; st.botCd = 1.2; st.rec = 0; st.ads = false;
    st.ammo = WEAPONS.map(w => w.mag); st.res = WEAPONS.map(w => w.reserve);
    st.reloading = false; st.rid++;
    cam.position.set((Math.random() - .5) * 6, CFG.player.eye + .01, -24);
    yaw = 0; pitch = 0;
    bot.position.set((Math.random() - .5) * 6, 1, 24);
    st.roundActive = false; startTimer(); hud();
    banner('GET READY', 1000);
    setTimeout(() => { st.roundActive = true; banner('FIGHT!', 700); }, 1200);
  }
  function endRound(playerWon, reason) {
    if (!st.roundActive) return;
    st.roundActive = false;
    if (playerWon) st.ps++; else st.bs++;
    hud();
    if (st.ps >= CFG.roundsToWin || st.bs >= CFG.roundsToWin) {
      banner(playerWon ? 'VICTORY' : 'DEFEAT', 3000, 'MATCH', playerWon ? 'g' : 'r');
      setTimeout(() => { st.ps = 0; st.bs = 0; startRound(); }, 3200);
    } else {
      if (reason) banner(reason, 1500, '', 'r'); else banner(playerWon ? 'WON' : 'LOST', 1500, 'ROUND', playerWon ? 'g' : 'r');
      setTimeout(startRound, 2000);
    }
  }

  // ---------- Input ----------
  const overlay = $('overlay');
  overlay.addEventListener('click', () => canvas.requestPointerLock());
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('pointerlockchange', () => {
    st.playing = document.pointerLockElement === canvas;
    overlay.style.display = st.playing ? 'none' : 'flex';
    setHud(st.playing);
    hero.setEnabled(!st.playing);
    bot.setEnabled(st.playing);
    st.ads = false; keys.fire = false;
    if (st.playing) {
      if (!started) { started = true; startRound(); }
      else if (saved) cam.position.copyFrom(saved);
    } else saved = cam.position.clone();
  });
  document.addEventListener('mousemove', e => {
    if (!st.playing) return;
    const k = 0.0022 * (cam.fov / 1.2);
    yaw += e.movementX * k; pitch += e.movementY * k;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
  });
  document.addEventListener('mousedown', e => {
    if (!st.playing) return;
    if (e.button === 0) { keys.fire = true; shoot(); }
    if (e.button === 2) st.ads = true;
  });
  document.addEventListener('mouseup', e => {
    if (e.button === 0) keys.fire = false;
    if (e.button === 2) st.ads = false;
  });
  document.addEventListener('wheel', e => { if (st.playing) setWeapon((st.w + (e.deltaY > 0 ? 1 : 2)) % 3); });
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (!st.playing) return;
    if (e.code === 'KeyR') reload();
    if (e.code === 'Digit1') setWeapon(0);
    if (e.code === 'Digit2') setWeapon(1);
    if (e.code === 'Digit3') setWeapon(2);
  });
  window.addEventListener('keyup', e => keys[e.code] = false);
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  window.addEventListener('resize', () => engine.resize());

  // ---------- Update loop ----------
  const downRay = new BABYLON.Ray(V3.Zero(), new V3(0, -1, 0), 3);
  const solidPick = m => m.isPickable && m.metadata?.solid;

  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);

    if (!st.playing) {
      cam.cameraDirection.set(0, 0, 0);
      mt += dt; cam.fov = 0.95;
      const a = Math.sin(mt * 0.35) * 0.8 + 0.5;
      cam.position.set(Math.sin(a) * 4.2 - 1, 2.3 + Math.sin(mt * 0.5) * 0.15, -24 + Math.cos(a) * 4.2);
      cam.setTarget(new V3(-1.4, 1.8, -24));
      hero.position.y = Math.sin(mt * 2) * 0.04;
      VM.forEach(g => g.setEnabled(false));
      return;
    }
    VM[st.w].setEnabled(!(st.w === 2 && st.adsK > 0.6));

    cam.rotation.y = yaw; cam.rotation.x = pitch;
    st.cd = Math.max(0, st.cd - dt);
    const W = WEAPONS[st.w];
    if (keys.fire && W.auto) shoot();
    if (st.rec > 0) { const back = Math.min(st.rec, st.rec * dt * 6 + 0.0005); pitch += back; st.rec -= back; }

    let mx = 0, mz = 0; st.moving = false;
    if (st.roundActive) {
      const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      if (f || r) {
        const len = Math.hypot(f, r);
        const sp = ((keys.ShiftLeft && !st.ads) ? CFG.player.sprint : CFG.player.speed) * (st.ads ? 0.6 : 1) * dt;
        mx = (Math.sin(yaw) * f + Math.cos(yaw) * r) / len * sp;
        mz = (Math.cos(yaw) * f - Math.sin(yaw) * r) / len * sp;
        st.moving = true;
      }
    }

    const eye = CFG.player.eye;
    downRay.origin.copyFrom(cam.position); downRay.length = eye + 0.6;
    const gr = scene.pickWithRay(downRay, solidPick);
    let dy;
    if (gr.hit && st.vy <= 0 && cam.position.y - gr.pickedPoint.y <= eye + 0.3) {
      st.grounded = true; st.vy = 0;
      dy = Math.max(-0.6, Math.min(0.6, (gr.pickedPoint.y + eye + 0.01) - cam.position.y));
    } else { st.grounded = false; st.vy -= CFG.player.gravity * dt; dy = st.vy * dt; }
    if (st.roundActive && keys.Space && st.grounded) { st.vy = CFG.player.jump; st.grounded = false; dy = st.vy * dt; }
    cam.cameraDirection.set(mx, dy, mz);
    if (cam.position.y < -6 && st.roundActive) { feed('YOU FELL'); endRound(false, 'YOU FELL'); }

    st.kick = Math.max(0, st.kick - dt * 8);
    st.bob += dt * (st.moving ? (keys.ShiftLeft ? 14 : 10) : 2);
    st.adsK += ((st.ads ? 1 : 0) - st.adsK) * Math.min(1, dt * 14);
    const bx = st.moving ? Math.sin(st.bob) * 0.012 : Math.sin(st.bob) * 0.002;
    const by = st.moving ? Math.abs(Math.cos(st.bob)) * 0.012 : Math.sin(st.bob) * 0.002;
    vm.position.set(0.34 * (1 - st.adsK) + bx, -0.32 + 0.12 * st.adsK - by, 0.75 - st.kick * 0.15);
    vm.rotation.x = -st.kick * 0.25;
    cam.fov += ((st.ads ? W.zoom : 1.2) - cam.fov) * Math.min(1, dt * 14);
    $('scope').style.display = (st.w === 2 && st.ads && st.adsK > 0.6) ? 'block' : 'none';

    updateBot(dt);
  });

  function hasLOS(from, to) {
    const d = to.subtract(from), dist = d.length();
    if (dist < 0.01) return true;
    return !scene.pickWithRay(new BABYLON.Ray(from, d.normalize(), dist), solidPick).hit;
  }

  function updateBot(dt) {
    const toP = cam.position.subtract(bot.position); toP.y = 0;
    const dist = toP.length();
    bot.rotation.y = Math.atan2(toP.x, toP.z);
    if (!st.roundActive) return;

    st.strafeT -= dt;
    if (st.strafeT <= 0) { st.strafeDir = Math.random() < .5 ? -1 : 1; st.strafeT = .6 + Math.random() * 1.4; }
    const n = toP.normalize();
    const side = new V3(n.z, 0, -n.x).scale(st.strafeDir);
    const eyeP = bot.position.add(new V3(0, 1.1, 0));
    const los = hasLOS(eyeP, cam.position);
    let fwd = 0;
    if (!los) fwd = 1; else if (dist > 14) fwd = 1; else if (dist < 8) fwd = -1;
    const mv = n.scale(fwd).add(side.scale(los ? 1 : 0.5));
    if (mv.lengthSquared() > 0) mv.normalize();
    mv.scaleInPlace(CFG.bot.speed * dt);
    const bx = bot.position.x, bz = bot.position.z;
    bot.moveWithCollisions(mv);
    const moved = Math.hypot(bot.position.x - bx, bot.position.z - bz);
    if (moved < mv.length() * 0.3) {
      st.botStuck += dt;
      if (st.botStuck > 0.25) { st.strafeDir *= -1; st.strafeT = 0.8; st.botStuck = 0; }
    } else st.botStuck = 0;

    const o = new V3(bot.position.x, bot.position.y + 0.5, bot.position.z);
    const gr = scene.pickWithRay(new BABYLON.Ray(o, new V3(0, -1, 0), 6), solidPick);
    if (gr.hit) bot.position.y += ((gr.pickedPoint.y + 1.0) - bot.position.y) * Math.min(1, dt * 12);

    st.botCd -= dt;
    const eye2 = bot.position.add(new V3(0, 1.1, 0));
    if (st.botCd <= 0 && los && dist < 60) {
      st.botCd = CFG.bot.fireDelay * (0.7 + Math.random() * 0.6);
      const hitIt = Math.random() < CFG.bot.accuracy;
      const aim = cam.position.add(hitIt ? V3.Zero() : new V3((Math.random() - .5) * 3, (Math.random() - .5) * 2, (Math.random() - .5) * 3));
      tracer(eye2, aim, new C3(1, .3, .3));
      sfx(200, 70, .07, 'square', .04);
      if (hitIt) {
        st.hp -= CFG.bot.damage; hurtFlash(); sfx(120, 60, .15, 'sawtooth', .1); hud();
        if (st.hp <= 0) { st.hp = 0; hud(); feed('BOT  \u27A4  YOU'); elim('Eliminated by <b>BOT</b>'); endRound(false); }
      }
    }
  }

  // ---------- Start ----------
  setHud(false);
  hud();
  engine.runRenderLoop(() => scene.render());
})();
</script>
</body>
</html>
